<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projet — Ornella Antony</title>
<style>

  @font-face{
    font-family:'DRKrapka';
    src: url('typos_site/DRKrapkaRound-BoldUpObl.woff') format('woff');
    font-weight:400;
    font-style:normal;
  }
  @font-face{
    font-family:'Velvelyne';
    src: url('typos_site/Velvelyne-Regular.woff') format('woff');
    font-weight:400;
    font-style:normal;
  }
  @font-face{
    font-family:'Tremplin';
    src: url('typos_site/Tremplin-Regular.woff') format('woff');
    font-weight:400;
    font-style:normal;
  }
    }
  @font-face{
    font-family:'TremplinLight';
    src: url('typos_site/Tremplin-Light.woff') format('woff');
    font-weight:400;
    font-style:normal;
  }
  @font-face{
    font-family:'Garabosse';
    src: url('typos_site/Garabosse-Gaillarde.woff') format('woff');
    font-weight:400;
    font-style:normal;
  }
  @font-face{
    font-family:'Dindong';
    src: url('typos_site/DINdong.woff') format('woff');
    font-weight:400;
    font-style:normal;
  }
  @font-face{
    font-family:'Feroniapi';
    src: url('typos_site/Feroniapi-MediumItalic.woff') format('woff');
    font-weight:400;
    font-style:normal;
  }
  @font-face{
    font-family:'GapSans';
    src: url('typos_site/gapsans-webfont.woff2') format('woff2');
    font-weight:400;
    font-style:normal;
  }

  :root{
    --chev-size:10px;        /* taille commune des chevrons de toutes les flèches */
    --chev-border:2px;       /* épaisseur commune des chevrons et des traits */
    --cyan:#8EE0FA;          /* bleu des bords et des mots-clés */
    --brown:#771B0D;

    /* ---- Grille de la page (mesurée sur l'image de référence) ---- */
    --split-x:71.1vw;        /* flèche verticale = bord droit des images */
    --gal-top:11.8vh;        /* haut du cadre image */
    --gal-h:77.2vh;          /* hauteur du cadre image (bas à 89vh) */
    --side-left:74.8vw;      /* colonne de texte à droite */
    --side-w:21.2vw;

    /* flèche horizontale du haut : début (pointe bleue = retour) et fin (pointe violette = projet suivant) */
    --hl-left:3.4vw;
    --hl-right:97vw;
    --hl-top:7.3vh;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    height:100vh;
    overflow:hidden;           /* la page ne défile jamais : seul le bandeau d'images défile */
    background:#fff;
    padding-top: env(safe-area-inset-top,0px);
    padding-bottom: env(safe-area-inset-bottom,0px);
  }
  a{ color:inherit; text-decoration:none; }

  /* ---------- RETOUR / PROJET SUIVANT : les deux pointes de la flèche du haut ---------- */
  .hl-link{
    position:fixed;
    top:var(--hl-top);
    width:44px; height:44px;
    margin:-22px 0 0 -22px;      /* zone cliquable centrée sur la pointe */
    z-index:11;
    border-radius:50%;
  }
  .hl-link.back{ left:var(--hl-left); }
  .hl-link.next{ left:var(--hl-right); }

  /* ---------- DÉGRADÉS BLEUS SUR LES BORDS ---------- */
  .edge{
    position:fixed;
    top:0; bottom:0;
    pointer-events:none;
    z-index:4;                 /* au-dessus des images et du titre, comme sur la référence */
  }
  .edge-left{
    left:0;
    width:11vw;
    background:linear-gradient(to right,
      rgba(142,224,250,1) 0,
      rgba(142,224,250,.6) 2.5vw,
      rgba(142,224,250,.25) 6vw,
      rgba(142,224,250,0) 11vw);
  }
  .edge-right{
    right:0;
    width:4.5vw;
    background:linear-gradient(to left,
      rgba(142,224,250,1) 0,
      rgba(142,224,250,.45) 1.6vw,
      rgba(142,224,250,0) 4.5vw);
  }

  /* ---------- MOTS-CLÉS (sous les images, calés à droite) ---------- */
  .tags{
    position:fixed;
    right:calc(100vw - var(--split-x) + 2.4vw);
    bottom:5vh;
    margin:0;
    font-family:'Velvelyne', sans-serif;
    font-size:clamp(.8rem, 1.15vw, 1.1rem);
    letter-spacing:.02em;
    color:var(--cyan);
    white-space:nowrap;
  }

  /* ---------- GALERIE D'IMAGES (défilement horizontal) ---------- */
  .gallery-wrap{
    position:fixed;
    left:0;                    /* le cadre part du bord gauche, sous le dégradé */
    top:var(--gal-top);
    width:var(--split-x);
    height:var(--gal-h);
  }
  .gallery{
    display:flex;
    gap:0;                     /* aucune marge entre les images */
    height:100%;
    overflow-x:auto;
    overflow-y:hidden;
    scrollbar-width:none;
  }
  .gallery::-webkit-scrollbar{ display:none; }
  .slide{
    flex:0 0 auto;
    height:100%;
    margin:0;
  }
  .slide img{
    display:block;
    height:100%;
    width:auto;
    max-width:none;
  }
  .slide.placeholder{
    width:var(--split-x);      /* = largeur du cadre */
    background:#d9d9d9;
    display:grid;
    place-items:center;
    font-family:'Tremplin', sans-serif;
    font-weight:700;
    letter-spacing:.05em;
  }

  /* ---------- VIDÉO YOUTUBE DANS LE CADRE ---------- */
    .slide.video{
    position:relative;                 /* pour placer le bouton « son » */
    aspect-ratio:var(--ratio, 16/9);   /* largeur calculée depuis la hauteur, comme une image */
  }
  .yt{
    position:relative;
    width:100%;
    height:100%;                        /* la vidéo prend toute la hauteur du cadre */
    background:#000 center / cover no-repeat;   /* vignette affichée pendant le chargement */
    overflow:hidden;
  }
  /* Le lecteur est plus haut que le cadre : la barre de titre YouTube (en haut)
     et le logo (en bas) dépassent et sont coupés. Il ne réagit pas à la souris,
     donc l'habillage YouTube n'apparaît pas au survol et la molette fait
     toujours défiler les images. Il reste invisible jusqu'au début de la lecture. */
  .yt iframe{
    position:absolute;
    left:0;
    top:-70px;
    width:100%;
    height:calc(100% + 140px);
    border:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .6s ease;
  }
  .yt.is-ready iframe{ opacity:1; }

  /* chargement : « ... » en DR Krapka bleu, les points apparaissent un à un, en boucle */
  .yt-loading{
    position:absolute;
    inset:0;
    z-index:1;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
    font-family:'DRKrapka', sans-serif;
    font-size:clamp(2rem, 4vw, 3.4rem);
    line-height:1;
    letter-spacing:.12em;
    color:#5BCEFF;
    transition:opacity .4s ease;
  }
  .yt.is-ready .yt-loading{ opacity:0; }
  .yt-loading span{ opacity:0; }
  .yt-loading span:nth-child(1){ animation:ytDot1 1.6s infinite; }
  .yt-loading span:nth-child(2){ animation:ytDot2 1.6s infinite; }
  .yt-loading span:nth-child(3){ animation:ytDot3 1.6s infinite; }
  @keyframes ytDot1{ 0%,10%{ opacity:0; } 15%,85%{ opacity:1; } 90%,100%{ opacity:0; } }
  @keyframes ytDot2{ 0%,30%{ opacity:0; } 35%,85%{ opacity:1; } 90%,100%{ opacity:0; } }
  @keyframes ytDot3{ 0%,50%{ opacity:0; } 55%,85%{ opacity:1; } 90%,100%{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .yt-loading span{ animation:none; opacity:1; } }

  /* bouton son (les vidéos démarrent muettes : obligatoire pour la lecture automatique) */
  .yt-sound{
    position:absolute;
    left:.9rem;                  /* en haut à gauche : toujours visible, même si la vidéo dépasse du cadre */
    top:.9rem;
    z-index:2;
    padding:.25rem .35rem;
    border:0;
    background:none;
    font-family:'DRKrapka', sans-serif;
    font-size:.8rem;
    color:#fff;
    -webkit-text-stroke:0.9px var(--brown);
    cursor:pointer;
  }
  .yt-sound:hover, .yt-sound:focus-visible{
    color:var(--brown);
    -webkit-text-stroke:2px #5BCEFF;
    paint-order:stroke fill;
  }

  /* ---------- TITRE DU PROJET ---------- */
  h1{
    position:absolute;
    left:5.6vw;
    bottom:-2vh;
    z-index:3;
    margin:0;
    font-family:'DRKrapka', sans-serif;
    font-weight:normal;
    font-size:clamp(3.5rem, 4.2vw, 3.6rem);
    line-height:1.1;
    color:#fff;
    -webkit-text-stroke:0.3em #000;
    paint-order:stroke fill;
    pointer-events:none;
  }

  /* ---------- COLONNE DE DROITE : texte + informations ---------- */
  .side{
    position:fixed;
    left:var(--side-left);
    width:var(--side-w);
    top:12.4vh;
    bottom:11vh;               /* le bas des infos s'aligne sur le bas du cadre image */
    display:flex;
    flex-direction:column;
    gap:1.5rem;
  }
  .texts{
    flex:1 1 auto;
    min-height:0;
    overflow-y:auto;           /* simple sécurité si un texte est trop long */
    scrollbar-width:none;
    display:grid;              /* tous les textes sont empilés au même endroit */
    align-content:start;
  }
  .texts::-webkit-scrollbar{ display:none; }
  .text{
    grid-area:1 / 1;
    opacity:0;
    transition:opacity .6s ease;
    pointer-events:none;
    font-family:'Garabosse', serif;
    font-size:clamp(0.7rem, 1.3vw, 1.6rem);
    line-height:1.7;
    color:#5f4449;
  }
  .text.is-active{ opacity:1; pointer-events:auto; }
  .text p{ margin:0 0 1em; }
  .text p{ margin:0 0 1em; white-space:pre-line; }

  .infos{
    flex:0 0 auto;
    font-family:'DinDong', sans-serif;
    font-size:clamp(.66rem, .85vw, .8rem);
    line-height:1.25;
    color:#7a3526;
  }
  .infos p{ margin:0 0 1em; }
  .infos p:last-child{ margin-bottom:0; }
  /* noms des ami·es en lien : pas soulignés, violets au survol */
  .infos a.friend{
    color:inherit;
    text-decoration:none;
    transition:color .2s ease;
  }
  .infos a.friend:hover, .infos a.friend:focus-visible{ color:#761AE7; }

  /* ---------- FLÈCHE VERTICALE (marron → vert) ---------- */
  .vline{
    position:fixed;
    left:calc(var(--split-x) - 1.5rem);
    top:0; bottom:0;
    width:3rem;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:2.6vh 0;
    pointer-events:none;
    z-index:10;
  }
  .vline .chevron-top,
  .vline .chevron-bottom{
    width:var(--chev-size);
    height:var(--chev-size);
    flex-shrink:0;
    position:relative;
    z-index:1;
  }
  .vline .chevron-top{
    border-top:var(--chev-border) solid var(--brown);
    border-left:var(--chev-border) solid var(--brown);
    transform:rotate(45deg);
  }
  .vline .chevron-bottom{
    border-bottom:var(--chev-border) solid #37E957;
    border-right:var(--chev-border) solid #37E957;
    transform:rotate(45deg);
  }
  .vline .line{
    flex:1;
    width:var(--chev-border);
    background:linear-gradient(to bottom, var(--brown), #37E957);
    margin-top:-9px;
    margin-bottom:-9px;
  }

  /* ---------- FLÈCHE HORIZONTALE (bleu → violet), en haut de la page ---------- */
  .hline{
    position:fixed;
    left:var(--hl-left);
    top:var(--hl-top);
    width:calc(var(--hl-right) - var(--hl-left));
    height:0;
    pointer-events:none;
    z-index:10;
  }
  .hline .line{
    position:absolute;
    left:0; right:0;
    top:calc(var(--chev-border) / -2);
    height:var(--chev-border);
    background:linear-gradient(to right, #5BCEFF, #761AE7);
  }
  .hline .head-left,
  .hline .head-right{
    position:absolute;
    top:calc(var(--chev-size) / -2);
    width:var(--chev-size);
    height:var(--chev-size);
  }
  /* survol d'une pointe cliquable : le chevron prend 2 px d'épaisseur */
  .hline .head-left, .hline .head-right{ transition:border-width .15s ease; }
  body:has(.hl-link.back:hover, .hl-link.back:focus-visible) .hline .head-left,
  body:has(.hl-link.next:hover, .hl-link.next:focus-visible) .hline .head-right{ border-width:calc(var(--chev-border) + 2px); }
  .hline .head-left{
    left:calc(var(--chev-size) * 0.207);
    border-left:var(--chev-border) solid #5BCEFF;
    border-bottom:var(--chev-border) solid #5BCEFF;
    transform:rotate(45deg);
  }
  .hline .head-right{
    right:calc(var(--chev-size) * 0.207);
    border-top:var(--chev-border) solid #761AE7;
    border-right:var(--chev-border) solid #761AE7;
    transform:rotate(45deg);
  }

  :focus-visible{ outline:2px solid #000; outline-offset:2px; }

  /* ---------- RESPONSIVE : images en haut, texte dessous ---------- */
  @media (max-width: 820px){
    :root{ --hl-left:7vw; --hl-right:92.4vw; --hl-top:calc(7.7vh + env(safe-area-inset-top,0px)); }
    .edge-left, .edge-right, .tags, .vline{ display:none; }        /* pas de dégradés sur les côtés */
    /* images d'un bord à l'autre de l'écran, plus hautes pour donner envie de les toucher */
    .gallery-wrap{ left:0; width:100vw; top:calc(11.2vh + env(safe-area-inset-top,0px)); height:39vh; cursor:zoom-in; }
    .slide.placeholder{ width:100vw; }
    /* titre à cheval sur le bas des images : c'est sa DERNIÈRE ligne qui chevauche le bord.
       Un titre sur 2 lignes monte sur l'image, et l'écart avec le texte reste le même. */
    h1{ left:7.6vw; right:8vw; bottom:0; transform:translateY(.55em); font-size:10vw; line-height:1.1; }
    .side{ left:8.3vw; right:7vw; width:auto; top:calc(55.5vh + env(safe-area-inset-top,0px)); bottom:6.5vh; gap:3vh; }
    /* le texte s'efface vers le bas ; il défile si besoin */
    .texts{
      padding-bottom:2rem;
      -webkit-mask-image:linear-gradient(to bottom, #000 72%, transparent 100%);
      mask-image:linear-gradient(to bottom, #000 72%, transparent 100%);
    }
    .text{ font-size:5.8vw; line-height:1.26; color:#1e1e1e; }
    .infos{ font-size:2.2vw; line-height:1.5; }
  }

  /* ---------- GALERIE PLEIN ÉCRAN (téléphone : toucher les images) ---------- */
  .gallery-veil, .gallery-infos{ display:none; }
  body.gallery-open .gallery-veil{
    display:block;
    position:fixed;
    inset:0;
    z-index:59;
    background:#fff;                 /* fond blanc, sans dégradé */
    cursor:zoom-out;
    animation:veilIn .35s ease;
  }
  body.gallery-open .gallery-wrap{
    position:fixed;
    z-index:60;
    top:8vh; bottom:8vh; left:8vw; right:8vw;
    width:auto; height:auto;
    cursor:auto;
    animation:veilIn .35s ease;
  }
  body.gallery-open .gallery-wrap h1{ display:none; }
  body.gallery-open .slide.placeholder{ width:84vw; }
  body.gallery-open .gallery-infos{
    display:block;
    position:absolute;
    left:0; bottom:0;
    z-index:2;
    max-width:75%;
    padding:0 1rem .8rem .9rem;
    font-family:'Dindong', sans-serif;
    font-size:.62rem;
    line-height:1.7;
    color:#7a3526;
    /* contour blanc de 2 px autour des lettres (le trait de 4 px passe à moitié derrière la lettre) */
    -webkit-text-stroke:4px #fff;
    paint-order:stroke fill;
  }
  .gallery-infos p{ margin:0; }
  .gallery-infos a.friend{ color:inherit; text-decoration:none; }
  @keyframes veilIn{ from{ opacity:0; } }

  /* téléphone tenu à la verticale : la galerie s'affiche automatiquement à l'horizontale
     (tourner le téléphone d'un quart de tour vers la gauche pour la regarder) */
  @media (orientation: portrait){
    body.gallery-open .gallery-veil{
      inset:auto;
      top:50%; left:50%;
      width:100vh; height:100vw;
      transform:translate(-50%, -50%) rotate(90deg);
    }
    body.gallery-open .gallery-wrap{
      inset:auto;
      top:50%; left:50%; right:auto; bottom:auto;
      width:84vh; height:83.6vw;
      transform:translate(-50%, -50%) rotate(90deg);
    }
    body.gallery-open .slide.placeholder{ width:84vh; }
    body.gallery-open .gallery{ touch-action:none; }    /* le glissement est géré par le script */
  }

  /* le menu n'existe que sur téléphone */
  @media (min-width: 821px){ #mobile-menu{ display:none; } }

  /* ---------- MENU TÉLÉPHONE ---------- */
  .menu-toggle, .menu-veil{ display:none; }
  @media (max-width: 820px){
    :root{ --chev-size:13px; }          /* chevrons un peu plus grands sur téléphone */
    .menu-toggle{
      display:block;
      position:fixed;
      z-index:45;
      top:calc(2vh + env(safe-area-inset-top,0px));
      left:50%; transform:translateX(-50%);
      padding:0;
      border:0;
      background:none;
      font-family:'Tremplin', sans-serif;
      font-weight:400;
      font-size:6.6vw;
      line-height:1.2;
      color:#6C22DE;
      cursor:pointer;
    }
    /* voile : bleu en haut qui se fond dans le blanc, léger vert tout en bas, page floutée dessous */
    .menu-veil{
      display:block;
      position:fixed;
      inset:0;
      z-index:40;
      background:linear-gradient(to bottom,
        rgba(140,224,250,1) 0%,
        rgba(183,236,252,.97) 13%,
        rgba(220,246,253,.93) 26%,
        rgba(255,255,255,.88) 43%,
        rgba(255,255,255,.88) 94%,
        rgba(214,254,244,.95) 100%);
      -webkit-backdrop-filter:blur(6px);
      backdrop-filter:blur(6px);
      opacity:0;
      visibility:hidden;
      transition:opacity .35s ease, visibility 0s linear .35s;
    }
    body.menu-open .menu-veil{ opacity:1; visibility:visible; transition:opacity .35s ease; }
    body.menu-open .menu-toggle{ opacity:0; pointer-events:none; }
    #mobile-menu{
      position:fixed;
      z-index:42;
      top:calc(6.2vh - 2.2vw + env(safe-area-inset-top,0px));
      left:8vw;
      right:auto;
      transform:translateY(-6px);
      display:flex;
      flex-direction:column;
      align-items:flex-start;
      gap:max(0px, calc(2.5vh - 4.4vw));
      padding:0;
      opacity:0;
      visibility:hidden;
      pointer-events:auto;
      transition:opacity .35s ease, transform .35s ease, visibility 0s linear .35s;
    }
    body.menu-open #mobile-menu{
      opacity:1;
      visibility:visible;
      transform:none;
      transition:opacity .35s ease, transform .35s ease;
    }
    #mobile-menu a{
      padding:.15em .1em;              /* marge autour des lettres : Safari (iPhone) coupait les contours */
      font-family:'DRKrapka', sans-serif;
      font-size:8.8vw;
      line-height:1.3;
      color:#fff;
      -webkit-text-stroke:1.3px #6C22DE;
      paint-order:normal;
    }
    #mobile-menu a:hover, #mobile-menu a:active, #mobile-menu a:focus-visible{
      color:#6C22DE;
      -webkit-text-stroke:1.3px #6C22DE;
    }
  }

  /* ---------- TRANSITION ENTRE L'ACCUEIL ET LES PAGES PROJET (sobre) ---------- */
  body{ animation:pageIn .6s ease backwards; }
  html.no-enter body{ animation:none; }
  body.is-leaving{ opacity:0; transition:opacity .45s ease; }
  @keyframes pageIn{ from{ opacity:0; } }
  @media (prefers-reduced-motion: reduce){
    body{ animation:none; }
    body.is-leaving{ transition:none; }
  }

  /* ---------- CURSEUR : une petite mouche (env. 1,5 × un curseur normal), partout sur la page ---------- */
  html, html *{

<script>
  // ---------- ORTHOTYPOGRAPHIE (toutes tailles d'écran) ----------
  // Espaces insécables automatiques : un mot d'une ou deux lettres ne reste jamais
  // seul en bout de ligne (il part avec le mot suivant), et la ponctuation
  // ; : ! ? » ) – - • ne commence jamais une ligne (elle reste avec le mot d'avant).
  function fixTypo(root){
    const skip = /^(SCRIPT|STYLE|CODE|PRE|TEXTAREA)$/;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: n => (n.parentElement && !skip.test(n.parentElement.tagName) && n.nodeValue.trim())
        ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT
    });
    const nodes = [];
    while(walker.nextNode()) nodes.push(walker.currentNode);
    nodes.forEach(n => {
      let v = n.nodeValue;
      v = v.replace(/(?<=(?:^|[\s\u00A0(«“"'’\[])[\p{L}\d]{1,2}) +(?=\S)/gu, '\u00A0'); // « à la », « de », « et »…
      v = v.replace(/ +(?=[;:!?»%)\]•–—])/g, '\u00A0');                              // ponctuation haute, fermantes
      v = v.replace(/ +(?=-\s)/g, '\u00A0');                                         // tiret « Paris - exposition »
      v = v.replace(/([«(“\[]) +/g, '$1\u00A0');                                      // après « et (
      if(v !== n.nodeValue) n.nodeValue = v;
    });
  }
  /* =====================================================================
     CONTENU DES PROJETS
     Chaque projet peut avoir :

       tags   : les mots-clés affichés en bleu au-dessus des images
       infos  : les petites lignes en bas à droite (une entrée = un bloc,
                \n = retour à la ligne)
       slides : la liste des images / vidéos, chacune avec son texte

     Une IMAGE :
       { src:'images/anarchiveuse-01.jpg', alt:'Description', text:'Texte.\n\nDeuxième paragraphe.' }

     Une VIDÉO YOUTUBE (colle simplement le lien de la vidéo) :
       { youtube:'https://www.youtube.com/watch?v=XXXXXXXXXXX', text:'Texte de la vidéo.' }
       - pour une vidéo verticale (format Shorts), ajoute  ratio:'9/16'

     Un texte par image : il apparaît en fondu quand l'image atteint 30 % de visibilité.
     Tant que `slides` vaut null, 3 images grises de démonstration sont affichées.
     L'ordre des projets ci-dessous est aussi l'ordre du lien « projet suivant ».
     ===================================================================== */
  const PROJECTS = {
    'anarchiveuse':            { title:"L'Anarchiveuse",
    tags:'design d’expérience, curation d‘archives, VJing',
    infos:[
      'juin 2026, École Estienne',
      'collectif Mouche, co-créé avec Gaspard Calais,\nLoane De Almeida Costa et Ulysse Migeat',
      'Prochainement exposé..es au 60Adada,\nSeine Saint Denis.'
    ],
    slides: [
      { youtube:'https://youtu.be/1-Y3RkCLCQk', 
       alt:'Mini-film',
      text:'Lancement de l’Anarchiveuse.'},
      { src:'images/anarchiveuse/ANARCHIVEUSE_MOUCHE_image03.webp',

  };

  const DEMO_SLIDES = [
    { src:'', text:"Texte associé à la première image.\n\nIl s'affiche ici et laisse sa place, en fondu, au texte suivant dès que la deuxième image atteint 30 % de visibilité dans le cadre." },

    { src:'', text:"Texte associé à la troisième image.\n\nOn peut en ajouter autant que nécessaire." }
  ];

  /* ---------- Construction de la page ---------- */
  const slug    = new URLSearchParams(location.search).get('p');
  const project = PROJECTS[slug] || {
    title:'Nom du projet',
    tags:'mots-clés, à, compléter',
    infos:['date', 'crédits : noms des personnes', 'lieu / exposition'],
    slides:null
  };
  const slides  = (project.slides && project.slides.length) ? project.slides : DEMO_SLIDES;

  document.title = project.title + ' — Ornella Antony';
  document.getElementById('title').textContent = project.title;
  document.getElementById('tags').textContent  = project.tags || '';

  /* ---------- Crédits : les noms ci-dessous deviennent automatiquement des liens ----------
     Pour ajouter quelqu'un :  'Prénom Nom': 'https://adresse…',
     (majuscules / minuscules indifférentes : « Louise orione » marche aussi) */
  const FRIENDS = {
    'Angèle Dumesny':   'https://angeledumesny.github.io/',
    'Elysa Picquendar': 'https://www.picquendar.art/',
    'Louise Orione':    'https://louiseorione.github.io/louise-orione/index.html',

    'Albane Heitz':     'https://www.instagram.com/albane.htz/',
    'Lucie Pensivy':    'https://www.instagram.com/antipykal/',
    'Loane De Almeida Costa': 'https://loanephos.fr/',

  };
  const friendNames = Object.keys(FRIENDS).sort((a, b) => b.length - a.length);
  const escapeRe = str => str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const friendRe = new RegExp('(?<!\\p{L})(' + friendNames.map(escapeRe).join('|') + ')(?!\\p{L})', 'giu');

  // ajoute une ligne de texte en transformant les noms connus en liens
  function appendWithLinks(parent, line){
    let last = 0;
    for(const m of line.matchAll(friendRe)){
      if(m.index > last) parent.appendChild(document.createTextNode(line.slice(last, m.index)));
      const key = friendNames.find(n => n.toLowerCase() === m[0].toLowerCase());
      const a = document.createElement('a');
      a.className = 'friend';
      a.href = FRIENDS[key];
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = m[0];
      parent.appendChild(a);
      last = m.index + m[0].length;
    }
    if(last < line.length) parent.appendChild(document.createTextNode(line.slice(last)));
  }

  const infosEl = document.getElementById('infos');
  (project.infos || []).forEach(block => {

  /* ---------- YouTube ---------- */
  function youtubeId(url){
    const m = String(url).match(/(?:youtu\.be\/|[?&]v=|embed\/|shorts\/|live\/)([\w-]{11})/);
    if(m) return m[1];
    return /^[\w-]{11}$/.test(url) ? url : null;
  }

  // ---------- Lecture automatique ----------
  // Chaque vidéo se lance (muette) quand elle est dans le cadre et se met en pause
  // quand elle en sort. Le bouton « son » active ou coupe le son.
  const PLAY_AT  = 0.3;    // part visible à partir de laquelle la vidéo se lance
  const PAUSE_AT = 0.2;    // en dessous, elle se met en pause

  function ytCommand(iframe, func, args){
    if(!iframe || !iframe.contentWindow) return;
    iframe.contentWindow.postMessage(JSON.stringify({ event:'command', func:func, args:args || [] }), '*');
  }

  function setupYouTube(fig, box, id, label){
    box.style.backgroundImage = 'url(https://i.ytimg.com/vi/' + id + '/hqdefault.jpg)';

    // « ... » de chargement, jusqu'au début de la lecture
    const loading = document.createElement('div');
    loading.className = 'yt-loading';
    loading.setAttribute('aria-hidden', 'true');
    loading.innerHTML = '<span>.</span><span>.</span><span>.</span>';
    box.appendChild(loading);
    let iframe = null, loaded = false, wantPlay = false, muted = true;

    const sound = document.createElement('button');
    sound.type = 'button';
    sound.className = 'yt-sound';
    sound.textContent = 'activer le son';
    sound.setAttribute('aria-pressed', 'false');
    sound.setAttribute('aria-label', 'Activer le son' + (label ? ' : ' + label : ''));
    sound.addEventListener('click', () => {
      muted = !muted;
      ytCommand(iframe, muted ? 'mute' : 'unMute');
      if(!muted) ytCommand(iframe, 'setVolume', [100]);
      sound.textContent = muted ? 'activer le son' : 'couper le son';
      sound.setAttribute('aria-pressed', String(!muted));
      sound.setAttribute('aria-label', (muted ? 'Activer' : 'Couper') + ' le son' + (label ? ' : ' + label : ''));
    });
    fig.appendChild(sound);

    function createPlayer(){
      const params = new URLSearchParams({
        autoplay:'0', mute:'1', controls:'0', rel:'0', playsinline:'1',
        loop:'1', playlist:id, iv_load_policy:'3', disablekb:'1', fs:'0', enablejsapi:'1'
      });
      if(location.protocol.startsWith('http')) params.set('origin', location.origin);
      iframe = document.createElement('iframe');
      iframe.src = 'https://www.youtube-nocookie.com/embed/' + id + '?' + params;
      iframe.title = label || 'Vidéo YouTube';
      iframe.allow = 'autoplay; encrypted-media; picture-in-picture';
      iframe.referrerPolicy = 'strict-origin-when-cross-origin';
      iframe.tabIndex = -1;
      iframe.addEventListener('load', () => {
        loaded = true;
        // s'abonne aux événements du lecteur (pour savoir quand la lecture démarre)
        iframe.contentWindow.postMessage(JSON.stringify({ event:'listening', id:id, channel:'widget' }), '*');
        if(!muted) ytCommand(iframe, 'unMute');
        if(wantPlay) ytCommand(iframe, 'playVideo');
        // filet de sécurité si le lecteur ne prévient pas
        setTimeout(() => { if(wantPlay) box.classList.add('is-ready'); }, 3000);
      });
      box.appendChild(iframe);
    }

    // appelé à chaque changement de visibilité de la vidéo dans le cadre
    fig._visibility = r => {
      if(r > 0 && !iframe) createPlayer();          // le lecteur se charge à l'approche
      if(r >= PLAY_AT && !wantPlay){
        wantPlay = true;
        if(loaded) ytCommand(iframe, 'playVideo');
      } else if(r < PAUSE_AT && wantPlay){
        wantPlay = false;
        if(loaded) ytCommand(iframe, 'pauseVideo');
      }
    };
    fig._isPlayer = w => iframe && iframe.contentWindow === w;
    fig._ready = () => box.classList.add('is-ready');
  }

  // le lecteur prévient quand la lecture commence : on l'affiche à ce moment-là
  window.addEventListener('message', e => {
    if(!/youtube(-nocookie)?\.com$/.test(new URL(e.origin, location.href).hostname)) return;
    let d; try{ d = typeof e.data === 'string' ? JSON.parse(e.data) : e.data; }catch(err){ return; }
    if(!d) return;
    const state = d.event === 'onStateChange' ? d.info
                : (d.event === 'infoDelivery' && d.info ? d.info.playerState : undefined);
    if(state !== 1) return;                       // 1 = lecture en cours
    document.querySelectorAll('.slide.video').forEach(fig => {
      if(fig._isPlayer && fig._isPlayer(e.source)) fig._ready();
    });
  });

  const gallery = document.getElementById('gallery');
  const textsEl = document.getElementById('texts');
  const slideEls = [];
  const textEls  = [];

  slides.forEach((s, i) => {
    const fig = document.createElement('figure');
    fig.className = 'slide';
    const ytId = s.youtube ? youtubeId(s.youtube) : null;

    if(ytId){
      fig.classList.add('video');
      if(s.ratio) fig.style.setProperty('--ratio', s.ratio);
      const box = document.createElement('div');
      box.className = 'yt';
      fig.appendChild(box);
      setupYouTube(fig, box, ytId, s.alt);
    } else if(s.src){
      const img = document.createElement('img');
      img.src = s.src;
      img.alt = s.alt || '';
      fig.appendChild(img);
    } else {
      fig.classList.add('placeholder');
      fig.textContent = 'IMAGE ' + (i + 1);
    }
    gallery.appendChild(fig);
    slideEls.push(fig);

    const t = document.createElement('div');
    t.className = 'text';
    (s.text || '').split(/\n\s*\n/).forEach(par => {
      if(!par.trim()) return;
      const p = document.createElement('p');
      p.textContent = par.trim().replace(/\s*\n\s*/g, ' ');
      t.appendChild(p);
    });
    textsEl.appendChild(t);
    textEls.push(t);
  });

  fixTypo(document.body);

  /* ---------- Texte actif : fondu quand une image franchit 30 % de visibilité ---------- */
  let active = 0;
  function setActive(i){
    if(i === active) return;
    textEls[active].classList.remove('is-active');
    textEls[i].classList.add('is-active');
    active = i;
  }
  textEls[0].classList.add('is-active');

  const THRESHOLD = 0.3;
  const prevRatio = slideEls.map(() => 0);
  const steps = Array.from({length:101}, (_, k) => k / 100);
  const io = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      const i = slideEls.indexOf(entry.target);
      const r = entry.intersectionRatio;
      // image pas encore chargée (largeur nulle) : on l'ignore. Sans ça, toutes les images
      // vides semblaient « visibles » à l'arrivée et le texte sautait à une image suivante.
      if(entry.boundingClientRect.width < 2){ prevRatio[i] = 0; return; }
      // on ne bascule que lorsque l'image FRANCHIT 30 % en entrant (évite les allers-retours)
      if(r >= THRESHOLD && prevRatio[i] < THRESHOLD) setActive(i);
      if(entry.target._visibility) entry.target._visibility(r);
      prevRatio[i] = r;
    });
  }, { root: gallery, threshold: steps });
  slideEls.forEach(el => io.observe(el));

  // tant qu'on est au début du bandeau, c'est le texte de la première image qui s'affiche
  // (les images se chargent dans le désordre et décalent les suivantes)
  function keepFirstText(){ if(gallery.scrollLeft < 5) setActive(0); }
  gallery.querySelectorAll('img, video').forEach(m => {
    m.addEventListener('load', keepFirstText);
    m.addEventListener('loadedmetadata', keepFirstText);
  });
  window.addEventListener('load', keepFirstText);

  /* ---------- Un seul défilement : la molette / le trackpad fait défiler les images à l'horizontale ---------- */
  window.addEventListener('wheel', e => {
    const d = Math.abs(e.deltaY) > Math.abs(e.deltaX) ? e.deltaY : e.deltaX;
    gallery.scrollLeft += d;
    e.preventDefault();
  }, { passive:false });

  // ---------- TRANSITION DE SORTIE : la page s'efface avant d'ouvrir la suivante ----------
  function leaveTo(url){
    if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ location.href = url; return; }
    document.body.classList.add('is-leaving');
    setTimeout(() => { location.href = url; }, 450);
  }
  // retour avec le bouton Précédent du navigateur : la page réapparaît normalement
  window.addEventListener('pageshow', () => document.body.classList.remove('is-leaving'));

  // retour / projet suivant / « projets » : la page s'efface avant de changer
  document.querySelectorAll('.hl-link, #mobile-menu a[href="index.html"]').forEach(a => {
    a.addEventListener('click', e => {
      if(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      e.preventDefault();
      leaveTo(a.href);
    });
  });

  // ---------- GALERIE PLEIN ÉCRAN (téléphone / tablette) ----------
  // toucher les images = galerie en grand (défilement horizontal) ; toucher à côté = sortie
  const touchScreen = window.matchMedia('(max-width: 820px), (hover: none)');
  const galleryInfos = document.querySelector('.gallery-infos');
  function setGallery(open){
    if(open) galleryInfos.innerHTML = document.getElementById('infos').innerHTML;
    document.body.classList.toggle('gallery-open', open);
  }
  gallery.addEventListener('click', e => {
    if(!touchScreen.matches || document.body.classList.contains('gallery-open')) return;
    if(e.target.closest('button')) return;                 // bouton « activer le son »
    setGallery(true);
  });
  document.querySelector('.gallery-veil').addEventListener('click', () => setGallery(false));

  // galerie tournée : glisser le doigt le long de l'écran fait défiler les images
  const portrait = window.matchMedia('(orientation: portrait)');
  let lastY = null;
  gallery.addEventListener('touchstart', e => {
    lastY = (document.body.classList.contains('gallery-open') && portrait.matches) ? e.touches[0].clientY : null;
  }, { passive:true });
  gallery.addEventListener('touchmove', e => {
    if(lastY === null) return;
    const y = e.touches[0].clientY;
    gallery.scrollLeft -= (y - lastY);
    lastY = y;
    e.preventDefault();
  }, { passive:false });
  gallery.addEventListener('touchend', () => { lastY = null; });
  document.addEventListener('keydown', e => { if(e.key === 'Escape') setGallery(false); });

  // ---------- MENU TÉLÉPHONE : « menu » ouvre la liste, un toucher à côté la referme ----------
  (function(){
    const btn  = document.querySelector('.menu-toggle');
    const veil = document.querySelector('.menu-veil');
    const nav  = document.getElementById('mobile-menu');
    if(!btn || !veil || !nav) return;
    function setMenu(open){
      document.body.classList.toggle('menu-open', open);
      btn.setAttribute('aria-expanded', String(open));
    }
    btn.addEventListener('click', e => { e.stopPropagation(); setMenu(!document.body.classList.contains('menu-open')); });
    veil.addEventListener('click', () => setMenu(false));
    nav.addEventListener('click', e => { if(e.target.closest('a')) setTimeout(() => setMenu(false), 150); });
    document.addEventListener('keydown', e => { if(e.key === 'Escape') setMenu(false); });
    window.addEventListener('pageshow', () => setMenu(false));
  })();
</script>

</body>
</html>
